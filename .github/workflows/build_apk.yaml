name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KS_PASS: ${{ secrets.KS_PASS }}
      KS_ALIAS: ${{ secrets.KS_ALIAS }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Preparar diretório app e restaurar keystore
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          mkdir -p app
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.keystore
            echo "Keystore restaurada com sucesso."
          else
            echo "AVISO: KS_B64 ausente; o APK sera assinado com chave de debug padrao."
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compilar APK (Debug)
        shell: bash
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Salvar log em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publicar APK em Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
