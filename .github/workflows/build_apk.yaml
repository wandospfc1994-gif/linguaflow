name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KS_PASS: ${{ secrets.KS_PASS }}
      KS_ALIAS: ${{ secrets.KS_ALIAS }}
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restaurar debug.keystore e release.keystore
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          mkdir -p app
          # Restaurar debug.keystore para assinatura do APK
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore restaurada a partir de debug.keystore.base64."
          elif [ ! -f "debug.keystore" ]; then
            # NÃO gerar uma chave nova aqui: cada build sairia com assinatura diferente e o Android
            # recusaria a atualização por cima do app instalado (obrigando a desinstalar e apagando
            # os modelos baixados em filesDir/models).
            echo "ERRO: debug.keystore.base64 ausente no repositório. Sem uma chave fixa, o APK não atualiza por cima do anterior." >&2
            exit 1
          fi

          # Restaurar release.keystore se fornecida
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.keystore
            echo "Release keystore restaurada com sucesso."
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compilar APK (Debug)
        shell: bash
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Salvar log em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publicar APK em Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
